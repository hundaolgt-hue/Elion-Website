<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>No points found here · Elyon Aerial Services</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
<style>
html,body{margin:0;height:100%;background:#0A1B33;color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.copy{position:fixed;left:50%;top:62%;transform:translateX(-50%);text-align:center}
h1{font-family:Sora,system-ui,sans-serif;font-weight:700;letter-spacing:-0.02em;font-size:clamp(28px,4vw,56px);margin:0}
p{color:rgba(189,226,255,.8);margin:12px 0 24px}
a{display:inline-flex;align-items:center;height:44px;padding:0 20px;border:1px solid #4FA5FF;border-radius:999px;color:#fff;text-decoration:none;font-weight:500;font-size:14px;transition:background .2s,box-shadow .2s}
a:hover{background:#1E63D6;box-shadow:0 0 24px rgba(189,226,255,.45)}
.label{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#4FA5FF;font-weight:500}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="copy"><div class="label">404</div><h1>No points found here</h1><p>The drone is still searching this grid.</p><a href="/">Back to the launch pad</a></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,t=0;const R=()=>{W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio};R();addEventListener('resize',R);
function draw(){t+=0.016;g.clearRect(0,0,W,H);const s=devicePixelRatio;
// empty grid
g.strokeStyle='rgba(189,226,255,0.08)';g.lineWidth=1;for(let x=0;x<W;x+=60*s){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=60*s){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
const dx=W/2+Math.sin(t*0.7)*W*0.22, dy=H*0.3+Math.sin(t*1.3)*10*s;
// scan cone
const sweep=Math.sin(t*2.2)*0.5;g.save();g.translate(dx,dy);g.rotate(sweep);const grad=g.createLinearGradient(0,0,0,H*0.5);grad.addColorStop(0,'rgba(79,165,255,0.35)');grad.addColorStop(1,'rgba(79,165,255,0)');g.fillStyle=grad;g.beginPath();g.moveTo(0,0);g.lineTo(-H*0.22,H*0.5);g.lineTo(H*0.22,H*0.5);g.closePath();g.fill();g.restore();
// drone
g.fillStyle='#0A1B33';g.strokeStyle='#4FA5FF';g.lineWidth=2*s;g.beginPath();g.roundRect(dx-18*s,dy-6*s,36*s,12*s,4*s);g.fill();g.stroke();
for(const k of[-1,1]){g.beginPath();g.moveTo(dx+k*18*s,dy);g.lineTo(dx+k*40*s,dy-10*s);g.stroke();g.save();g.translate(dx+k*40*s,dy-10*s);g.rotate(t*30);g.strokeStyle='rgba(189,226,255,.8)';g.beginPath();g.moveTo(-14*s,0);g.lineTo(14*s,0);g.stroke();g.restore()}
g.fillStyle='#4FA5FF';g.beginPath();g.arc(dx,dy+9*s,3*s,0,7);g.fill();requestAnimationFrame(draw)}draw();
</script>
</body>
</html>
